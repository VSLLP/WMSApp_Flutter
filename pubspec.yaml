name: epicor
description: "A Epicor ERP App Project developed for CFIL by ValueScore LLP."
version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8  
  intl: ^0.19.0
  provider: ^6.1.2
  connectivity_plus: ^6.0.5
  http: ^1.2.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  device_info_plus: ^10.1.2
  webview_flutter_plus: ^0.4.7
  modal_bottom_sheet: ^3.0.0
  swipe_refresh: ^1.1.2
  lottie: ^3.1.2
  skeletonizer: ^1.4.2
  flutter_svg: ^2.0.10+1
  calendar_date_picker2: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/anim/  

  fonts:
    - family: Material
      fonts:        
        - asset: assets/fonts/MaterialIcons-Regular.ttf
          weight: 400        
    - family: OpenSans
      fonts:        
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400        
        - asset: assets/fonts/OpenSans-Semibold.ttf
          weight: 600        